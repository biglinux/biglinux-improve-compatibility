# JamesDSP
#
# Keep jamesdsp_sink from ever becoming the default audio sink. See the script
# for the reasoning.
#
# The script is pulled in through a virtual component that merely *wants* it.
# Marking the script itself required would take WirePlumber down with it -- and
# every sound on the system -- if it ever failed to load; marking it optional
# in the profile does not load it at all, since nothing else depends on it. A
# want loads it, and a failure only costs this safeguard, logged as a notice.

wireplumber.profiles = {
  main = {
    biglinux.jamesdsp-not-default = required
  }
}

wireplumber.components = [
  {
    name = biglinux/jamesdsp-not-default.lua, type = script/lua
    provides = hooks.biglinux.jamesdsp-not-default
  }
  {
    type = virtual, provides = biglinux.jamesdsp-not-default
    wants = [ hooks.biglinux.jamesdsp-not-default ]
  }
]
